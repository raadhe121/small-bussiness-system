<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — DukaanSetu</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        padding: 1.5rem;
      }
      .card {
        max-width: 26rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 4px 24px rgba(31, 38, 135, 0.08);
      }
      .icon {
        width: 4rem; height: 4rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: #eef2ff;
        display: grid; place-items: center;
        font-size: 2rem;
      }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      p { color: #64748b; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
      button {
        background: #4f46e5; color: #fff; border: 0;
        padding: 0.65rem 1.5rem; border-radius: 0.6rem;
        font-size: 0.9rem; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been cached yet. Cached pages like Products, Sales and
        the Dashboard still work — and any sales you record offline will sync
        automatically when you're back online.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
